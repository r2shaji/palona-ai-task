version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: palona-sql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: palona_shop
      MYSQL_USER: palona
      MYSQL_PASSWORD: palonapassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - palona-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-upalona", "-ppalonapassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: palona-backend:latest
    container_name: palona-backend
    restart: always
    ports:
      - "5001:5001"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-open-api-key-here}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: palona
      DB_PASSWORD: palonapassword
      DB_NAME: palona_shop
      API_BASE_URL: http://localhost:5001
    networks:
      - palona-network
      
  frontend:
    image: palona-frontend:latest
    container_name: palona-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://54.234.186.113:5001
    networks:
      - palona-network

networks:
  palona-network:
    driver: bridge

volumes:
  mysql_data: